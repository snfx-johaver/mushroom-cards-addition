<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan, car, and printer source comparisons</title>
    <style>
      :root {
        color-scheme: light;
        --primary-text-color: #282828;
        --secondary-text-color: #9e9e9e;
        --primary-background-color: #fff;
        --card-background-color: #fff;
        --ha-card-background: #fff;
        --ha-card-box-shadow: 0 2px 8px rgba(0,0,0,.16);
        font-family: Roboto, Arial, sans-serif;
        background: #eee;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 18px; }
      h1 { margin: 0 0 14px; font-size: 18px; }
      .comparison { display: grid; grid-template-columns: var(--width) var(--width); gap: 18px; align-items: center; }
      .column { min-width: 0; }
      .label { margin-bottom: 6px; color: #666; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
      .reference-frame {
        width: var(--width);
        height: var(--reference-height);
        overflow: hidden;
        border-radius: 12px;
        background: #eee;
      }
      .reference-frame img {
        display: block;
        width: var(--reference-width);
        max-width: none;
        transform: translate(var(--reference-x), var(--reference-y));
      }
      .implementation {
        display: grid;
        width: var(--width);
        min-height: var(--reference-height);
        align-items: center;
      }
      ha-card { display: block; }
      ha-icon { display: inline-grid; width: 24px; height: 24px; place-items: center; }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <main id="comparison"></main>
    <script type="module" src="/demo/fan-car-printer-comparison.ts"></script>
  </body>
</html>
