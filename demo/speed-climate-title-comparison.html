<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed, climate, and title source comparisons</title>
    <style>
      :root {
        color-scheme: light;
        --primary-text-color: #212121;
        --secondary-text-color: #777;
        --card-background-color: #fff;
        --ha-card-background: #fff;
        --divider-color: #ddd;
        --google-yellow: #fbbc04;
        --google-blue: #4285f4;
        --google-green: #34a853;
        --google-red: #ea4335;
        font-family: Roboto, Arial, sans-serif;
        background: #eef0f3;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 18px; }
      #comparisons { display: grid; gap: 18px; }
      .comparison {
        width: calc(var(--width) * 2 + 52px);
        padding: 16px;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 2px 9px rgba(0, 0, 0, .12);
      }
      h2 { margin: 0 0 12px; font-size: 15px; }
      .columns { display: grid; grid-template-columns: var(--width) var(--width); gap: 20px; align-items: center; }
      .label { margin-bottom: 6px; color: #777; font-size: 10px; font-weight: 700; text-transform: uppercase; }
      .reference-frame, .implementation { width: var(--width); min-width: 0; overflow: hidden; }
      .reference-frame { display: grid; min-height: var(--height); place-items: center; background: #f5f5f5; }
      .reference-frame img { display: block; width: var(--width); max-height: 360px; object-fit: contain; }
      .source-blueprint {
        display: grid;
        width: 100%;
        min-height: var(--height);
        grid-template-columns: 48px minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        padding: 12px;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 2px 7px rgba(0, 0, 0, .14);
      }
      .source-blueprint > ha-icon { --mdc-icon-size: 30px; color: #4285f4; }
      .source-blueprint span { display: grid; gap: 4px; }
      .source-blueprint small { color: #777; }
      ha-card { display: block; }
      ha-icon { display: inline-flex; width: var(--mdc-icon-size, 24px); height: var(--mdc-icon-size, 24px); }
      ha-icon svg { display: block; width: 100%; height: 100%; fill: currentColor; }
    </style>
  </head>
  <body>
    <main id="comparisons"></main>
    <script type="module" src="/demo/speed-climate-title-comparison.ts"></script>
  </body>
</html>
