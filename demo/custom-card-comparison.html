<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom card visual comparisons</title>
    <style>
      :root {
        color-scheme: light;
        --primary-text-color: #212121;
        --secondary-text-color: #888;
        --card-background-color: #fff;
        --ha-card-background: #fff;
        --divider-color: #e8e8e8;
        --google-blue: #4285f4;
        font-family: Roboto, system-ui, sans-serif;
        background: #f1f2f4;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 28px; color: var(--primary-text-color); }
      h1 { margin: 0 0 6px; }
      body > p { margin: 0 0 22px; color: var(--secondary-text-color); }
      #comparisons { display: grid; gap: 20px; }
      .comparison { padding: 16px; border-radius: 18px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
      .comparison h2 { margin: 0 0 12px; font-size: 15px; }
      .columns { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(280px, 1fr); gap: 18px; align-items: start; }
      .column-label { margin-bottom: 7px; color: var(--secondary-text-color); font-size: 11px; font-weight: 700; text-transform: uppercase; }
      .reference { display: block; max-width: 100%; max-height: 360px; border-radius: 10px; object-fit: contain; object-position: left top; }
      .no-reference { display: grid; min-height: 100px; place-items: center; border-radius: 10px; background: #f5f5f5; color: var(--secondary-text-color); font-size: 12px; }
      .implementation { max-width: 440px; }
      ha-card { display: block; }
      ha-icon { display: inline-flex; width: 24px; height: 24px; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; }
      @media (max-width: 720px) { .columns { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <h1>Custom card visual audit batch</h1>
    <p>Live-dashboard failures rebuilt from pinned upstream source and documentation references.</p>
    <main id="comparisons"></main>
    <script type="module" src="/demo/custom-card-comparison.ts"></script>
  </body>
</html>
